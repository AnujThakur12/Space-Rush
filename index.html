<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Space Strike</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="loading-screen">
        <h1>SPACE STRIKE</h1>
        <div class="subtitle">Endless Space</div>
        <div class="loading-bar-container">
            <div class="loading-bar"></div>
        </div>
    </div>

    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
    </div>

    <button class="touch-pause" id="touchPause" aria-label="Pause">||</button>

    <script>
        window.SKYSTRIKE_API_URL = '';
    </script>
    <script src="js/storage.js"></script>
    <script src="js/assets.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/controls.js"></script>
    <script src="js/collision.js"></script>
    <script src="js/effects.js"></script>
    <script src="js/bullet.js"></script>
    <script src="js/player.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/boss.js"></script>
    <script src="js/powerups.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/game.js"></script>
    <script type="module" src="js/renderer3d.js"></script>
    <script type="module" src="js/boot.js"></script>
</body>

</html>
